        (exec/hora antes x depois)"
      - "F19 e analise e recomendacao interna (Vya) — aprovacao pelo
        project-manager e suficiente para publicar a recomendacao e avancar para
        F21/F25"

  - id: "F20"
    name: "Probe sintetico end-to-end de desempenho N8N"
    status: "not-started"
    scope:
      - "Script de sonda que dispara webhook N8N a cada 5 minutos e mede tempo
        de resposta"
      - "Captura de latencia real percebida: fila + execucao + overhead de
        resposta"
      - "Publicacao da metrica no Prometheus para historico e alertas"
    acceptance_criteria:
      - "Metrica de latencia end-to-end disponivel no VictoriaMetrics para wf001"
      - "Baseline de latencia documentado antes e apos cada acao de tunning"

  - id: "F21"
    name: "Avaliacao de batching para 121Labs PABX call-analytics"
    status: "not-started"
    scope:
      - "Avaliar agrupamento de eventos PABX por janela de 1 minuto antes de
        disparar o workflow N8N (ANA-001: potencial reducao de 60x no volume —
        8.400 exec/hora -> ~140 exec/hora)"
      - "Propor arquitetura de buffer (N8N Schedule Trigger ou middleware
        externo) compativel com a integracao atual do cliente 121Labs"
      - "Estimar impacto da reducao no PostgreSQL execution_entity e na fila de
        execucao N8N"
    acceptance_criteria:
      - "Analise de viabilidade tecnica documentada com impacto estimado em
        exec/hora e carga no PostgreSQL"
      - "Proposta apresentada e aprovada pelo cliente 121Labs antes de qualquer
        implementacao"

  - id: "F22"
    name: "Adicao de buckets sub-100ms ao histograma do N8N"
    status: "not-started"
    scope:
      - "Adicionar buckets de resolucao fina ao
        n8n_workflow_execution_duration_seconds: 0.005, 0.01, 0.025, 0.05"
      - "Atualizar configuracao do prom-client no prod-collector-api ou no
        container N8N via variavel de ambiente ou plugin"
      - "Validar que os novos buckets aparecem no endpoint /metrics e sao
        coletados pelo Prometheus e armazenados no VictoriaMetrics"
    acceptance_criteria:
      - "p50 e p95 sub-100ms mensuraveis por workflow apos a atualizacao"
      - "Historico de latencia real disponivel no VictoriaMetrics para
        comparacao antes x depois de cada acao de tunning (F17, F18, F20)"

  - id: "F23"
    name: "Correcao do monitoramento de memoria do servidor wf001"
    status: "not-started"
    scope:
      - "Diagnosticar por que node_memory_* retorna vazio no scrape de wf001
        (label instance incorreto identificado no ANA-001)"
      - "Corrigir configuracao de relabeling do scrape config Prometheus para o
        node_exporter de wf001"
      - "Validar que metricas de memoria RAM e swap aparecem no VictoriaMetrics
        para instance=wf001"
    acceptance_criteria:
      - "node_memory_MemAvailable_bytes{instance='wf001'} retorna valores
        validos no Prometheus/VictoriaMetrics"
      - "Dashboard de memoria de wf001 funcional — complementa dados de CPU ja
        disponiveis (baseline ANA-001: 1-3% CPU em condicao normal)"

  - id: "F24"
    name: "Habilitacao de metricas de concorrencia do N8N"
    status: "not-started"
    scope:
      - "Ativar e validar n8n_concurrency_* no endpoint /metrics do container
        N8N (versao 2.6.4 em wf001 — ja atende requisito >= 0.214; sem
        pre-requisito de troca de versao)"
      - "Monitorar execucoes simultaneas ativas vs. limite de concorrencia
        configurado no N8N"
      - "Criar alerta Prometheus para concorrencia proxima do limite (threshold
        recomendado: 80% do max configurado)"
    acceptance_criteria:
      - "n8n_concurrency_current e n8n_concurrency_limit visiveis no
        VictoriaMetrics para wf001"
      - "Hipotese de workers saturados (causa da lentidao percebida no ANA-001)
        confirmada ou descartada com dados reais"

  - id: "F25"
    name: "Avaliacao de isolamento de workload para workflows de alto volume"
    status: "not-started"
    scope:
      - "Avaliar viabilidade tecnica de instancia N8N dedicada (wf002 ou
        container separado em wf001) para 121Labs PABX call-analytics (57% do
        volume total — 429K exec/90d)"
      - "Avaliar impacto no PostgreSQL compartilhado caso instancias separadas
        usem o mesmo banco"
      - "Documentar arquitetura proposta com estimativa de custo operacional e
        ganhos de isolamento esperados"
    acceptance_criteria:
      - "Analise de viabilidade documentada: beneficios, riscos e custo
        operacional estimado"
      - "Decisao go/no-go registrada em SESSION_REPORT com justificativa e
        aprovacao do project-manager"

execution_order:
  source: "ANA-001 — prioridade por impacto operacional"
  phases:
    - phase: "P1"
      label: "Instrumentacao e correcao critica"
      note: "Features independentes entre si — podem ser executadas em paralelo em
        wfdb01 antes de promover em bloco para wf001"
      features: [ "F16", "F17", "F18" ]
    - phase: "P2"
      label: "Observabilidade complementar"
      note: "Depende de P1 estar estavel em wf001; F20 requer F16 ativo para medir
        latencia de fila no probe end-to-end"
      features: [ "F23", "F20", "F22", "F24" ]
    - phase: "P3"
      label: "Analise e governanca de workload"
      note: "Depende de dados coletados pelas fases P1 e P2; F21 e F25 requerem
        aprovacao do project-manager e validacao com cliente 121Labs antes de
        qualquer implementacao"
      features: [ "F19", "F21", "F25" ]

mcp_questions:
  discovery:
    - id: "Q01"
      question: "Qual versao exata do n8n esta em execucao no ambiente
        wf001.vya.digital (31.220.103.208)?"
      rationale: "Confirmar baseline de tunning — versao 2.6.4 documentada; confirmar
        se N8N >= 0.214 para habilitar F24 (metricas de concorrencia)"
      expected_answer_type: "string"
      default: "2.6.4"
      feature_ref: "F16"

    - id: "Q02"
      question: "Qual e a estrategia de rate-limiting ou batching atualmente adotada
        para os workflows de alto volume (121Labs PABX, WhatsApp Gateway)?"
      rationale: "Base para F19 — documentar estado atual antes de emitir recomendacao
        de governanca de throughput"
      expected_answer_type: "text"
      feature_ref: "F19"

    - id: "Q03"
      question: "Quais workflows sao criticos para validacao obrigatoria pos-tunning?
        (referencia: 121Labs PABX, hub-whatsapp-api-gateway-evolution-api)"
      rationale: "Definir cobertura minima de testes — ANA-001 identificou os
        workflows de maior volume; qualquer acao de tunning deve validar esses
        fluxos antes de promover para wf001"
      expected_answer_type: "list"
      feature_ref: "F20"

  performance:
    - id: "Q04"
      question: "As metricas de fila do N8N (n8n_queue_*) estao habilitadas no
        container de wf001?"
      rationale: "Principal lacuna identificada no ANA-001 — hipotese de fila saturada
        nao confirmavel sem essa metrica"
      expected_answer_type: "boolean"
      feature_ref: "F16"

    - id: "Q05"
      question: "Qual o tamanho atual da tabela execution_entity no PostgreSQL do N8N?"
      rationale: "429K+ execucoes acumuladas podem ser gargalo de I/O — requer analise
        antes da purgacao"
      expected_answer_type: "string"
      feature_ref: "F17"

    - id: "Q06"
      question: "A purgacao automatica de execucoes esta habilitada
        (EXECUTIONS_DATA_PRUNE=true)? Qual a retencao atual?"
      rationale: "Sem purgacao, a tabela execution_entity cresce indefinidamente
        degradando o banco"
      expected_answer_type: "map"
      feature_ref: "F17"

    - id: "Q07"
      question: "O prod-collector-api ainda envia metricas via Pushgateway
        (PROMETHEUS_PUSHGATEWAY_ENABLED=true)?"
      rationale: "Dupla coleta ativa gera contagem duplicada no VictoriaMetrics —
        correcao identificada em ANA-001"
      expected_answer_type: "boolean"
      feature_ref: "F18"

    - id: "Q08"
      question: "Quais limites de desempenho sao aceitaveis pos-tunning? (ex: p95 <
        100ms, fila < 50 itens, CPU < 30%)"
      rationale: "Estabelecer criterio objetivo de aceite para os gates de promocao
        entre wfdb01 e wf001 por feature"
      expected_answer_type: "map"
      feature_ref: "F20"

  compatibility:
    - id: "Q09"
      question: "Quais dependencias externas devem ser validadas para cada acao de
        tunning (PostgreSQL, Redis, webhooks, credenciais OAuth)?"
      rationale: "Evitar regressao de integracao — acoes de tunning em variaveis de
        ambiente ou recriacao de containers podem afetar conexoes ativas"
      expected_answer_type: "list"
      feature_ref: "F17"

    - id: "Q10"
      question: "Quais variaveis de ambiente N8N serao alteradas pelas acoes de
        tunning (F16: QUEUE_METRICS, F17: EXECUTIONS_DATA_PRUNE, F18:
        PUSHGATEWAY_ENABLED, F24: CONCURRENCY)?"
      rationale: "Prevenir falha de configuracao — mapear todas as variaveis
        modificadas por feature antes de aplicar em wf001"
      expected_answer_type: "map"
      feature_ref: "F16"

    - id: "Q11"
      question: "O Traefik esta configurado para rotear trafego do N8N em wf001?
        Labels e middlewares serao preservados apos acoes de tunning?"
      rationale: "Todos os servidores usam Traefik como proxy — recriacao do container
        pode perder labels de roteamento"
      expected_answer_type: "boolean"
      feature_ref: "F17"

  operations:
    - id: "Q12"
      question: "Qual janela de manutencao aprovada para execucao das acoes de tunning
        em wf001 (especialmente F17 purgacao PostgreSQL e F18 dupla coleta)?"
      rationale: "Alinhar operacao com disponibilidade do servico — ambiente de
        producao exige coordenacao antes de qualquer mudanca"
      expected_answer_type: "string"
      feature_ref: "F17"

    - id: "Q13"
      question: "Qual procedimento de backup sera usado antes de cada operacao
        destrutiva? (dump PG + snapshot volume Docker)"
      rationale: "Garantir recuperacao em caso de falha — cada purgacao ou recriacao
        de container precisa de backup proprio validado"
      expected_answer_type: "text"
      feature_ref: "F13"

    - id: "Q14"
      question: "Quais evidencias devem ser coletadas para aprovar promocao de cada
        acao de tunning de wfdb01 para wf001?"
      rationale: "Padronizar auditoria — ANA-001 define metricas de referencia como
        criterio de aceite; cada feature deve ter evidencias de antes/depois"
      expected_answer_type: "list"
      feature_ref: "F14"

    - id: "Q15"
      question: "O probe sintetico end-to-end (F20) sera implementado antes ou apos as
        primeiras acoes de tunning (F16/F17/F18)?"
      rationale: "Definir baseline de latencia pre-tunning e comparar pos-tunning para
        validar melhora ou regressao com dados objetivos"
      expected_answer_type: "enum"
      options: [ "antes", "apos", "simultaneamente" ]
      feature_ref: "F20"

  governance:
    - id: "Q16"
      question: "Qual responsavel aprova cada gate Speckit (constitution, plan, tasks,
        implement) neste projeto?"
      rationale: "Definir accountability por etapa — SDD exige decisoes rastreadas por
        responsavel"
      expected_answer_type: "map"

    - id: "Q17"
      question: "Qual estrategia de rastreabilidade sera usada entre spec
        (objetivo.yaml), tarefas e execucao?"
      rationale: "Suportar SDD e auditoria — todos os artefatos devem ser
        referenciados por feature_id"
      expected_answer_type: "text"

    - id: "Q18"
      question: "Quais riscos bloqueadores impedem promover para producao? (ex: falha
        no pos-check, perda de dado, workflow critico com erro)"
      rationale: "Definir criterios de no-go para cada acao de tunning antes de
        promover de wfdb01 para wf001"
      expected_answer_type: "list"
      feature_ref: "F14"

rules:
  - "Seguir o fluxo de trabalho do framework Speckit"
  - "Escopo restrito a tunning e instrumentacao (F16–F25) — upgrade de versao
    N8N e fora do escopo deste projeto (clarificado em 2026-04-02)"
  - "Sequencia de features: P1 (F16/F17/F18) -> P2 (F23/F20/F22/F24) -> P3
    (F19/F21/F25) conforme ANA-001"
  - "Fluxo de trabalho deve ser guiado por prompts para GitHub Copilot"
  - "Configuracao MCP deve ser gerada automaticamente baseada nas especificacoes"
  - "Sistema de versionamento e historico deve rastrear todas as mudancas"
  - "N8N em producao roda em wf001.vya.digital (31.220.103.208) — alteracoes
    exigem janela de manutencao e backup validado"
  - "Ambiente de teste do N8N publicado em wfdb01.vya.digital (86.48.31.149),
    pasta /opt/docker_user/n8n"
  - "Todos os servidores Docker utilizam Traefik como proxy reverso — labels
    devem ser preservados"
  - "Atencao a configuracao de conexao SSH SPA contidos em .secrets/ssh.json"
  - "Credenciais e tokens nunca devem ser embutidos em artefatos versionados"
  - "Toda operacao em wf001 requer evidencias metricas de antes/depois
    documentadas no SESSION_REPORT correspondente"

output_contract:
  expected_outputs:
    - "Documentacao em Markdown com historico de acoes e debates de sessao
      (docs/SESSIONS/)"
    - "Playbooks Ansible idempotentes para instrumentacao e tunning (F16–F25)"
    - "Scripts Python para pre-check, pos-check, backup e probe sintetico
      end-to-end"
    - "Artefatos de configuracao: variaveis de ambiente N8N, Traefik labels,
      Prometheus scrape config"
    - "Relatorio de tunning PostgreSQL com evidencias de purgacao e otimizacao
      de queries"
    - "Relatorio de correcao da dupla coleta Prometheus com validacao de
      metricas"
  quality_requirements:
    - "Documentacao incremental e cronologica por sessao"
    - "Rastreabilidade ponta a ponta: feature_id -> tarefa -> execucao ->
      evidencia"
    - "Rollback testavel para cada acao de tunning antes de promover para wf001"
    - "Validacao funcional e nao funcional com baseline ANA-001 como referencia"
    - "Zero exposicao de credenciais em artefatos versionados"
    - "Execucao nao interativa e auditavel (logs estruturados)"
  project_memory:
    baseline_report: "docs/n8n_perf_ANA001_20260101_20260331_20260331T154646.md"
    spec_source: "docs/objetivo.yaml"
    mcp_config: "docs/mcp-questions.yaml"
    sessions_dir: "docs/SESSIONS/"
    ssh_secrets: ".secrets/ssh.json"

clarifications:
  - q: "specification.rules tinha regras de upgrade de versao N8N, fora do escopo do
      projeto. Como alinhar ao escopo de tunning?"
    a: "Substituir por: (1) operacoes em wf001 exigem janela de manutencao + backup
      validado; (2) toda mudanca exige evidencias metricas antes/depois no
      SESSION_REPORT; (3) alteracoes em workflows de clientes requerem aprovacao
      do project-manager."
  - q: "Qual e a sequencia de execucao das features F16-F25?"
    a: "P1 (paralelo) F16/F17/F18; P2 F23/F20/F22/F24; P3 F19/F21/F25 — conforme
      prioridade de impacto operacional do ANA-001."
  - q: "Qual e a versao atual do N8N em wf001? F24 requer >= 0.214."
    a: "Versao 2.6.4 — ja atende o requisito de F24 (>= 0.214). Nenhuma troca de
      versao necessaria para habilitar metricas de concorrencia."
  - q: "F19 requer gate externo de aprovacao com clientes 121Labs e/ou Evolution API
      antes de publicar recomendacoes?"
    a: "Nao — F19 e analise e recomendacao interna (Vya). Aprovacao pelo
      project-manager e suficiente. Sem gate externo com clientes."
