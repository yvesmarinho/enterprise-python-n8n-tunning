mcp_questions:
  discovery:
    - id: "Q01"
      question: "Qual versao exata do n8n esta em execucao no ambiente
        wf001.vya.digital (31.220.103.208)?"
      rationale: "Confirmar baseline antes do upgrade — default documentado: 2.6.4"
      expected_answer_type: "string"
      default: "2.6.4"
      feature_ref: "F19"

    - id: "Q02"
      question: "Qual estrategia de update de container sera adotada (in-place,
        blue-green, canary) mantendo upgrade versao a versao?"
      rationale: "Definir risco, plano de rollback e trilha de versoes intermediarias"
      expected_answer_type: "enum"
      options: [ "in-place", "blue-green", "canary" ]
      feature_ref: "F19"

    - id: "Q03"
      question: "Quais workflows sao criticos para validacao obrigatoria pos-upgrade?
        (referencia: 121Labs PABX, hub-whatsapp-api-gateway-evolution-api)"
      rationale: "Definir cobertura minima de testes — ANA-001 identificou os
        workflows de maior volume"
      expected_answer_type: "list"
      feature_ref: "F19"

  performance:
    - id: "Q04"
      question: "As metricas de fila do N8N (n8n_queue_*) estao habilitadas no
        container de wf001?"
      rationale: "Principal lacuna identificada no ANA-001 — hipotese de fila saturada
        nao confirmavel sem essa metrica"
      expected_answer_type: "boolean"
      feature_ref: "F16"

    - id: "Q05"
      question: "Qual o tamanho atual da tabela execution_entity no PostgreSQL do N8N?"
      rationale: "429K+ execucoes acumuladas podem ser gargalo de I/O — requer analise
        antes da purgacao"
      expected_answer_type: "string"
      feature_ref: "F17"

    - id: "Q06"
      question: "A purgacao automatica de execucoes esta habilitada
        (EXECUTIONS_DATA_PRUNE=true)? Qual a retencao atual?"
      rationale: "Sem purgacao, a tabela execution_entity cresce indefinidamente
        degradando o banco"
      expected_answer_type: "map"
      feature_ref: "F17"

    - id: "Q07"
      question: "O prod-collector-api ainda envia metricas via Pushgateway
        (PROMETHEUS_PUSHGATEWAY_ENABLED=true)?"
      rationale: "Dupla coleta ativa gera contagem duplicada no VictoriaMetrics —
        correcao identificada em ANA-001"
      expected_answer_type: "boolean"
      feature_ref: "F18"

    - id: "Q08"
      question: "Quais limites de desempenho sao aceitaveis pos-upgrade? (ex: p95 <
        100ms, fila < 50 itens, CPU < 30%)"
      rationale: "Estabelecer criterio objetivo de aceite para os gates de promocao
        entre versoes"
      expected_answer_type: "map"
      feature_ref: "F19"

  compatibility:
    - id: "Q09"
      question: "Quais dependencias externas devem ser validadas (PostgreSQL, Redis,
        webhooks, credenciais OAuth)?"
      rationale: "Evitar regressao de integracao — conexoes e credenciais sao frageis
        entre versoes do N8N"
      expected_answer_type: "list"
      feature_ref: "F19"

    - id: "Q10"
      question: "Existe mudanca de variaveis de ambiente entre a versao atual (2.6.4)
        e a alvo?"
      rationale: "Prevenir falha de startup por variaveis descontinuadas ou novas
        obrigatorias"
      expected_answer_type: "boolean"
      feature_ref: "F19"

    - id: "Q11"
      question: "O Traefik esta configurado para rotear trafego do N8N em wf001?
        Labels e middlewares estao corretos?"
      rationale: "Todos os servidores usam Traefik como proxy — re-criacao do
        container pode perder labels"
      expected_answer_type: "boolean"
      feature_ref: "F19"

  operations:
    - id: "Q12"
      question: "Qual janela de manutencao aprovada para execucao do upgrade em wf001?"
      rationale: "Alinhar operacao com disponibilidade do servico — ambiente de producao"
      expected_answer_type: "string"
      feature_ref: "F19"

    - id: "Q13"
      question: "Qual procedimento de backup sera usado antes de cada versao
        intermediaria? (dump PG + snapshot volume Docker)"
      rationale: "Garantir recuperacao em caso de falha — cada versao intermediaria
        precisa de backup proprio"
      expected_answer_type: "text"
      feature_ref: "F13"

    - id: "Q14"
      question: "Quais evidencias devem ser coletadas para aprovar promocao de cada
        versao intermediaria?"
      rationale: "Padronizar auditoria — ANA-001 define metricas de referencia como
        criterio de aceite"
      expected_answer_type: "list"
      feature_ref: "F14"

    - id: "Q15"
      question: "O probe sintetico end-to-end (F20) sera implementado antes ou apos o
        primeiro upgrade de versao?"
      rationale: "Definir baseline de latencia pre-upgrade e comparar pos-upgrade para
        validar melhora ou regressao"
      expected_answer_type: "enum"
      options: [ "antes", "apos", "simultaneamente" ]
      feature_ref: "F20"

  governance:
    - id: "Q16"
      question: "Qual responsavel aprova cada gate Speckit (constitution, plan, tasks,
        implement) neste projeto?"
      rationale: "Definir accountability por etapa — SDD exige decisoes rastreadas por
        responsavel"
      expected_answer_type: "map"

    - id: "Q17"
      question: "Qual estrategia de rastreabilidade sera usada entre spec
        (objetivo.yaml), tarefas e execucao?"
      rationale: "Suportar SDD e auditoria — todos os artefatos devem ser
        referenciados por feature_id"
      expected_answer_type: "text"

    - id: "Q18"
      question: "Quais riscos bloqueadores impedem promover para producao? (ex: falha
        no pos-check, perda de dado, workflow critico com erro)"
      rationale: "Definir criterios de no-go para cada versao intermediaria do upgrade"
      expected_answer_type: "list"
      feature_ref: "F19"

rules:
  - "Seguir o fluxo de trabalho do framework Speckit"
  - "Criar fluxo de atualizacao de container do n8n evitando erros de
    compatibilidade e desempenho"
  - "Atualizacao do n8n deve ocorrer versao a versao desde 2.6.4 ate latest, sem
    pular versoes"
  - "A resolucao da versao latest deve usar tags oficiais Docker Hub do N8N como
    fonte primaria"
  - "Fluxo de trabalho deve ser guiado por prompts para GitHub Copilot"
  - "Configuracao MCP deve ser gerada automaticamente baseada nas especificacoes"
  - "Sistema de versionamento e historico deve rastrear todas as mudancas"
  - "N8N em producao roda em wf001.vya.digital (31.220.103.208) — alteracoes
    exigem janela de manutencao"
  - "Ambiente de teste do N8N publicado em wfdb01.vya.digital (86.48.31.149),
    pasta /opt/docker_user/n8n"
  - "Todos os servidores Docker utilizam Traefik como proxy reverso — labels
    devem ser preservados"
  - "Atencao a configuracao de conexao SSH SPA contidos em .secrets/ssh.json"
  - "Credenciais e tokens nunca devem ser embutidos em artefatos versionados"

