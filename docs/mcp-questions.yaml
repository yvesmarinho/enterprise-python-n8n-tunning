project_context:
  description: >
    Projeto para analisar as propostas de melhorias do
    'enterprise-python-analysis', verificar configuracoes existentes e aplicar
    ajustes para melhorar o desempenho do N8N. A analise ANA-001 (90 dias,
    jan-mar/2026) identificou ofensores de volume (121Labs PABX 429K exec,
    WhatsApp Gateway 84K exec) e lacunas de instrumentacao (fila, memoria,
    sub-100ms) como causas raiz. O upgrade versao a versao (2.6.4 -> latest) e
    uma das acoes do plano.
  source_version: "2.6.4"
  target_version: "latest"
  latest_resolution:
    source_precedence:
      - "official_n8n_docker_hub_tags"
      - "official_n8n_release_notes_fallback"
    resolved_target_frozen_per_round: true
    required_evidence:
      - "source_url"
      - "resolved_timestamp"
      - "resolved_version"
  upgrade_policy: "sequential_version_by_version"
  skip_versions_allowed: false
  response_expected: >
    Documentos e codigos Python e Ansible para: (1) habilitar metricas de fila
    N8N, (2) purgacao e tunning do PostgreSQL, (3) corrigir dupla coleta
    Prometheus, (4) automatizar upgrade incremental versao a versao, (5) probe
    sintetico end-to-end.
  workflow_reference: "objetivo.yaml -> Copilot -> mcp-questions.yaml -> MCP automatico"
  infrastructure:
    proxy: "Traefik — todos os servidores Docker utilizam Traefik como proxy reverso"
    servers:
      - hostname: "wf001.vya.digital"
        ip: "31.220.103.208"
        role: "Servidor Docker de producao — hospeda o N8N e outros containers de
          aplicacao"
        services:
          - "N8N (container principal — foco deste projeto)"
          - "prod-collector-api (expoe metricas N8N via scrape direto na porta
            5001)"
          - "Outros containers de aplicacao em producao"
        path_n8n: "/opt/docker_user/n8n"
        path_docker_default: "/opt/docker_user"
        notes:
          - "Ambiente de producao — alteracoes exigem janela de manutencao e
            backup validado"
          - "Scrape Prometheus: targets 31.220.103.208:5001, relabeling
            instance=wf001"
      - hostname: "wfdb01.vya.digital"
        ip: "86.48.31.149"
        role: "Servidor Docker de producao — hospeda a stack Prometheus/VictoriaMetrics"
        services:
          - "VictoriaMetrics (armazenamento de metricas — fonte de dados
            ANA-001)"
          - "Prometheus (coleta e scrape de metricas)"
          - "Pushgateway (dupla coleta a corrigir via F18)"
          - "Outros containers de monitoramento e infraestrutura"
        path_docker_default: "/opt/docker_user"
        notes:
          - "Ambiente de teste do N8N publicado neste servidor, pasta
            /opt/docker_user/n8n"
          - "Acesso via SSH SPA conforme .secrets/ssh.json"
      - hostname: "wfdb02.vya.digital"
        ip: "82.197.64.145"
        role: "Servidor de Banco de dados de producao — hospeda o PostgreSQL e MySQL,
          base de dados do N8N e outros bancos de dados"
        services:
          - "PostgreSQL versao 16 — porta 6432"
          - "Pgbouncer (pool de conexoes para PostgreSQL) — porta 5432"
          - "MySQL versao 8.4 — porta 3306"
          - "Node Exporter (monitoramento via Prometheus)"
          - "Outros containers de monitoramento e infraestrutura"
        path_docker_default: "/opt/docker_user"
        notes:
          - "Banco dedicado de producao — operacoes DDL exigem backup validado"
          - "F17 (pg_stat_statements, postgres_exporter, pg_dump) executadas
            neste servidor"
          - "Acesso via SSH SPA conforme .secrets/ssh.json"
  test_environment:
