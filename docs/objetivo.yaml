        foco:
          - "Tunning e otimização das queries SQL do banco PostgreSQL do N8N"
          - "Análise de índices, planos de execução e saturação da tabela
            execution_entity (429K+ execuções)"
          - "Validação de integridade e consistência dos dados pré e pós-upgrade
