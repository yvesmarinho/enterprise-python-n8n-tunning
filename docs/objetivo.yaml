prompt:
  role: user
  content:
    description: "Projeto para analisar as propostas de melhorias enviadas pelo
      'enterprise-python-analysis', verrificar as configurações existentes e
      fazer os ajustes necessários para melhorar o desempenho do N8N."
    specification:
      - project_name: "enterprise-python-n8n-tunning"
      - response: "Documentos e códigos Python e Ansible para analizar e ajustar a
          configuração do N8N visando melhorar o desempenho, seguindo o fluxo de
          trabalho do framework Speckit e utilizando prompts para GitHub
          Copilot."
      - docstyle: "Documentar o código, se possível, segundo padrão reStructuredText do
          Docstring, incluindo Doct test. Design pattern Fabric. Melhores
          práticas de desenvolvimento Python e Ansible."
      - workflow: "objetivo.yaml → Copilot → mcp-questions.yaml → MCP automático"
      - rules:
          - "Seguir o fluxo de trabalho do framework Speckit."
          - "Toda operação de tunning em wf001 requer janela de manutenção
            definida e backup validado antes da execução."
          - "Toda mudança aplicada em wf001 exige evidências métricas de
            antes/depois registradas no SESSION_REPORT correspondente."
          - "Nenhuma alteração em workflows de clientes (121Labs PABX, Evolution
            API WhatsApp) deve ser realizada sem análise de impacto aprovada
            pelo project-manager."
          - "Fluxo de trabalho deve ser guiado por prompts para GitHub Copilot"
          - "Configuração MCP deve ser gerada automaticamente baseada nas
            especificações"
          - "Sistema de versionamento e histórico deve rastrear todas as
            mudanças"
          - "Ambiente de teste está publicado no servidor `wfdb01`, na pasta
            `/opt/docker_user/n8n`."
          - "Atenção à configuração de conexão SSH SPA contidos em
            `.secrets/ssh.json`"
    infrastructure:
      proxy: "Traefik — todos os servidores Docker utilizam Traefik como proxy
        reverso"
      servers:
        - hostname: "wf001.vya.digital"
          ip: "31.220.103.208"
          role: "Servidor Docker de produção — hospeda o N8N e outros containers de
            aplicação"
          servicos:
            - "N8N (container principal — foco deste projeto)"
            - "prod-collector-api (expõe métricas N8N via scrape direto na porta
              5001)"
            - "Outros containers de aplicação em produção"
          path_n8n: "/opt/docker_user/n8n"
          path_docker_derfault: "/opt/docker_user"
          notas:
            - "Ambiente de produção — alterações exigem janela de manutenção e
              backup validado"
            - "Scrape Prometheus configurado: targets 31.220.103.208:5001,
              relabeling instance=wf001"
            - "Servidor VPS USA/East Coast/New York — latência de rede otimizada
              para clientes globais"
        - hostname: "wf008.vya.digital"
          ip: "31.220.103.208"
          role: "Servidor Docker de produção — hospeda o Journey System e outros
            containers de aplicação próprios da Vya"
          servicos:
            - "Journey System, sistema interno de jornada de campanhas de
              marketing (container principal — fora deste projeto)"
            - "prod-collector-api (expõe métricas N8N via scrape direto na porta
              5001)"
            - "PostgreSQL (banco de dados do Journey System — fora deste
              projeto)"
          path_docker_derfault: "/opt/docker_user"
          notas:
            - "Ambiente de produção — alterações exigem janela de manutenção e
              backup validado"
            - "Servidor VPS Brasil/São Paulo — latência de rede otimizada para
              clientes brasileiros"
        - hostname: "wfdb01.vya.digital"
          ip: "86.48.31.149"
          role: "Servidor Docker de produção — hospeda a stack Prometheus/VictoriaMetrics
            e outros containers"
          servicos:
            - "VictoriaMetrics (armazenamento de métricas — fonte de dados do
              ANA-001)"
            - "Prometheus (coleta e scrape de métricas)"
            - "Pushgateway (receptor de métricas push — dupla coleta a corrigir
              via F18)"
            - "Outros containers de monitoramento e infraestrutura"
          path_docker_derfault: "/opt/docker_user"
          notas:
            - "Ambiente de teste do N8N publicado neste servidor, pasta
              /opt/docker_user/n8n - SERVIDOR DE TESTE - NÃO É PRODUÇÃO!!!"
            - "Acesso via SSH SPA conforme .secrets/ssh.json"
            - "Container com PostgreSQL é para uso exclusivo do stack
              Prometheus/VictoriaMetrics — não hospeda nenhum banco de dados de
              aplicação"
            - "Servidor VPS USA/East Coast/New York — latência de rede otimizada
              para clientes globais"
        - hostname: "wfdb02.vya.digital"
          ip: "82.197.64.145"
          role: "Servidor de Banco de dados de produção — hospeda o PostgreSQL e MySQL,
            base de dados do N8N e outros bancos de dados"
          servicos:
            - "PostgresSQL versão 16 - porta 6432"
            - "Pgbouncer (pool de conexões para PostgreSQL) porta 5432"
            - "MySQL versão 8.4 porta 3306"
            - "Node Exporter (monitoramento de banco de dados via Prometheus)"
            - "Outros containers de monitoramento e infraestrutura"
          notas:
            - "Ambiente de produção — alterações exigem janela de manutenção e
              backup validado"
            - "Acesso via SSH SPA conforme .secrets/ssh.json"
            - "Servidor VPS USA/East Coast/New York — latência de rede otimizada
              para clientes globais"
    folder_structure:
      - ".vscode - Configurações VS Code e MCP (geradas automaticamente)"
      - ".github - Workflows de GitHub Actions para automação de CI/CD e AI
        agents"
      - ".specify - Github Sepckit framework configuration e templates"
      - "docs - Documentação (gerada automaticamente)"
      - "docs/SESSIONS - Histórico cronológico de sessões"
      - "docs/SESSIONS/YYYY-MM-DD/DAILY_ACTIVITIES_YYYY-MM-DD.md - Histórico das
        atividades diárias e decisões tomadas"
      - "docs/SESSIONS/YYYY-MM-DD/DEBATE_*_YYYY-MM-DD.md - Registro de debates
        entre agentes, incluindo decisões tomadas e justificativas"
      - "docs/SESSIONS/YYYY-MM-DD/ERROR_*_YYYY-MM-DD.md - Registro de erros e
        exceções ocorridos durante as sessões, com as soluções aplicadas para
        resolução"
      - "docs/SESSIONS/YYYY-MM-DD/FINAL_STATUS_YYYY-MM-DD.md - Registro de
        status final de cada sessão, incluindo resultados alcançados e lições
        aprendidas"
      - "docs/SESSIONS/YYYY-MM-DD/SESSION_REPORT_YYYY-MM-DD.md - Relatório
        detalhado de cada sessão, incluindo decisões, aprendizados e próximos
        passos"
      - "docs/SESSIONS/YYYY-MM-DD/SESSION_RECOVERY_YYYY-MM-DD.md - Registro de
        recuperação de sessões em caso de falhas ou interrupções"
      - "docs/objetivo.yaml - Especificação detalhada do projeto"
      - "docs/mcp-questions.yaml - Configuração gerada pelo Copilot"
      - "docs/n8n_perf_ANA001_20260101_20260331_20260331T154646.md - Análise de
        desempenho do N8N com base em dados coletados"
      - "src - Código-fonte do projeto (estrutura específica por tipo)"
      - "test - Testes automatizados (framework baseado na linguagem)"
      - "scripts - Scripts de automação inteligente"
    expected_outcome:
      - return_info: >
          Arquivos MD com a documentação de todas as ações e todos os chats.
          Objetivando documentação e memória do projeto, incluindo decisões,
          mudanças e aprendizados. Para cada debate entre os agentes, deve ser
          gerado um arquivo MD específico com o histórico do debate, decisões
          tomadas e justificativas. O arquivo deve seguir o padrão de
          nomenclatura `debate-YYYYMMDD-HHMMSS.md` e conter uma estrutura clara
          de tópicos, incluindo Resumo do Debate, Decisões Tomadas,
          Justificativas e Ações Pendentes. Códigos Python e Ansible para tratar
          todas as ações. Aplicar as melhores práticas de segurança para evitar
          exposição de dados sensíveis, especialmente em relação à configuração
          SSH. Garantir que o processo seja auditável, com logs detalhados e
          rastreabilidade de todas as mudanças.
      - workflow_result: "Fluxo de 4 etapas: constitution → clarify → plan → checklist→
          tasks → analyze → implement"
      - ai_integration: "Prompts específicos de agents para GitHub Copilot guiarem toda
          a configuração"
      - multi_technology: "Suporte automático para Python e Ansible."
    profile:
      - role: system_architect
        skill_level: "expert"
        description: "Arquiteto em soluções Docker com Linux Debian 12."
        foco:
          - "Arquitetura de tunning de performance para stack N8N + PostgreSQL +
            Prometheus/VictoriaMetrics em wf001 e wfdb01"
          - "Estratégia de rollback seguro para operações de tunning — snapshots
            de volumes Docker e backup PostgreSQL"
          - "Definição de gates técnicos para promoção de mudanças de wfdb01
            (teste) para wf001 (produção)"
        responsabilidades:
          - "Definir arquitetura de cada ação de tunning com isolamento de risco"
          - "Aprovar sequência de execução por etapas do workflow Speckit"
          - "Definir janelas de manutenção e critérios de rollback por feature"
        criterios_decisao:
          - "Priorizar disponibilidade e integridade de dados"
          - "Evitar mudanças não reversíveis sem backup validado"
      - role: N8N_specialist
        skill_level: "expert"
        description: "Especialista em N8N e automação de workflows."
        foco:
          - "Análise de volume e padrões de execução dos workflows críticos
            (121Labs PABX 429K exec, WhatsApp Gateway 84K exec)"
          - "Configuração de métricas N8N: fila (F16), concorrência (F24) e
            buckets sub-100ms (F22)"
          - "Validação funcional de workflows após cada ação de tunning"
        responsabilidades:
          - "Mapear impacto de cada ação de tunning nos workflows activos"
          - "Definir checklist de validação pós-tunning por feature"
          - "Validar comportamento de workflows nos ambientes wfdb01 e wf001"
        criterios_decisao:
          - "Zero perda de execuções e credenciais"
          - "Sem regressão funcional nos fluxos críticos"
      - role: devops_engineer
        skill_level: "expert"
        description: "Expert em Python, Ansible e SDD (Specification-Driven Development)."
        foco:
          - "Automação idempotente de atualização"
          - "Padronização de scripts e playbooks"
          - "Implementação orientada por especificação (SDD)"
          - "Coleta de evidências técnicas e logs de execução"
        responsabilidades:
          - "Especificar automações de pré-check, upgrade e pós-check"
          - "Padronizar variáveis de ambiente e parâmetros de execução"
          - "Garantir rastreabilidade entre especificação e execução"
          - "Garantir reprodutibilidade do processo em múltiplos ambientes"
        criterios_decisao:
          - "Execução não interativa e auditável"
          - "Conformidade com requisitos definidos na especificação"
          - "Falhas tratadas com retorno e ação de recuperação"
      - role: devops_automation
        skill_level: "advanced"
        description: "Especialista em DevOps, automação de workflows de desenvolvimento
          e SDD."
        foco:
          - "Orquestração do fluxo objetivo.yaml -> mcp-questions.yaml -> MCP"
          - "Governança de documentação e versionamento"
          - "Adoção de SDD para padronizar decisões técnicas"
          - "Padronização dos prompts e artefatos de sessão"
        responsabilidades:
          - "Garantir consistência entre especificação, plano e tarefas"
          - "Rastrear mudanças e dependências entre artefatos"
          - "Assegurar que execução siga os critérios definidos em spec"
          - "Definir critérios de completude de cada etapa"
        criterios_decisao:
          - "Rastreabilidade ponta a ponta das decisões"
          - "Priorizar entregas aderentes ao ciclo SDD"
          - "Documentação incremental e verificável"
      - role: project_manager
        skill_level: "advanced"
        description: "Gestor de projetos com foco em governança, planejamento e entrega
          incremental."
        foco:
          - "Planejamento de marcos e cronograma do upgrade"
          - "Sequenciamento e controle de versões intermediárias em cada etapa"
          - "Gestão de riscos, comunicação e alinhamento entre perfis"
          - "Acompanhamento de progresso por critérios de aceite"
        responsabilidades:
          - "Definir plano de execução e priorização por impacto"
          - "Gerenciar dependências, impedimentos e decisões"
          - "Garantir visibilidade de status para stakeholders"
        criterios_decisao:
          - "Maximizar previsibilidade de entrega"
          - "Reduzir risco operacional durante a janela de mudança"
      - role: test_engineer
        skill_level: "expert"
        description: "Engenheiro de testes para validação funcional, regressão e
          desempenho das ações de tunning."
        foco:
