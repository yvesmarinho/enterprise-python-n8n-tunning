    execution_order:
      source: "ANA-001 — prioridade por impacto operacional"
      phases:
        - phase: "P1"
          label: "Instrumentação e correção crítica"
          note: "Features independentes entre si — podem ser executadas em paralelo em
            wfdb01 antes de promover em bloco para wf001"
          features: [ F16, F17, F18 ]
        - phase: "P2"
          label: "Observabilidade complementar"
          note: "Depende de P1 estar estável em wf001; F20 requer F16 ativo para medir
            latência de fila no probe end-to-end"
          features: [ F23, F20, F22, F24 ]
        - phase: "P3"
          label: "Análise e governança de workload"
          note: "Depende de dados coletados pelas fases P1 e P2; F21 e F25 requerem
            aprovação do project-manager e validação com cliente 121Labs antes
            de qualquer implementação"
          features: [ F19, F21, F25 ]

    clarifications:
      items:
        - q: "specification.rules tinha 3 regras de upgrade de versão N8N, fora do escopo
            do projeto. Como alinhar ao escopo de tunning?"
          a: "Substituir as 3 regras por: (1) operações em wf001 exigem janela de
            manutenção + backup validado; (2) toda mudança exige evidências
            métricas antes/depois no SESSION_REPORT; (3) alterações em workflows
            de clientes requerem aprovação do project-manager."
        - q: "Perfis system_architect, N8N_specialist e test_engineer tinham foco e
            responsabilidades voltados a upgrade de versão N8N. Como alinhar ao
            escopo de tunning?"
          a: "Reescrever foco e responsabilidades dos 3 perfis: system_architect →
            arquitetura de tunning + gates wfdb01→wf001; N8N_specialist →
            análise de volume de execuções + métricas N8N (F16/F22/F24);
            test_engineer → validação pré/pós-tunning por feature (F16–F25) com
            evidências métricas."
        - q: "Qual é a sequência de execução das features F16–F25 para o speckit.plan?"
          a: "Sequência ANA-001 por prioridade de impacto: P1 (paralelo) F16 → F17 → F18;
            P2 F23 → F20 → F22 → F24; P3 F19 → F21 → F25."
        - q: "Qual é a versão atual do N8N em wf001? F24 requer >= 0.214."
          a: "Versão 2.6.4 — já atende o requisito de F24 (>= 0.214). Nenhuma troca de
            versão é necessária para habilitar as métricas de concorrência."
        - q: "F19 requer gate externo de aprovação com clientes 121Labs e/ou Evolution API
            antes de publicar recomendações?"
          a: "Não — F19 é análise e recomendação interna (Vya). Aprovação pelo
            project-manager é suficiente. Sem gate externo com clientes."
