          - "Documentar política de throughput recomendada por workflow e
            cliente para orientar decisões de escalonamento e isolamento"
        criterio_aceite:
          - "Volume dos 2 workflows de alto volume documentado e justificado
            pela base de clientes e configuração atual da integração"
          - "Recomendação de rate-limiting ou batching emitida com impacto
            estimado (exec/hora antes × depois)"
          - "F19 é análise e recomendação interna (Vya) — sem gate externo com
            clientes; aprovação pelo project-manager é suficiente para publicar
            a recomendação e avançar para F21/F25"
      - id: F20
        nome: "Probe sintético end-to-end de desempenho N8N"
        status: "not-started"
        escopo:
          - "Script de sonda que dispara webhook N8N a cada 5 minutos e mede
            tempo de resposta"
          - "Captura de latência real percebida: fila + execução + overhead de
            resposta"
          - "Publicação da métrica no Prometheus para histórico e alertas"
        criterio_aceite:
          - "Métrica de latência end-to-end disponível no VictoriaMetrics para
            wf001"
          - "Baseline de latência documentado antes e após cada ação de tunning"
      - id: F21
        nome: "Avaliação de batching para 121Labs PABX call-analytics"
        status: "not-started"
        escopo:
          - "Avaliar agrupamento de eventos PABX por janela de 1 minuto antes de
            disparar o workflow N8N (ANA-001: potencial redução de 60× no volume
            — 8.400 exec/hora → ~140 exec/hora)"
          - "Propor arquitetura de buffer (N8N Schedule Trigger ou middleware
            externo) compatível com a integração atual do cliente 121Labs"
          - "Estimar impacto da redução no PostgreSQL execution_entity e na fila
            de execução N8N"
        criterio_aceite:
          - "Análise de viabilidade técnica documentada com impacto estimado em
            exec/hora e carga no PostgreSQL"
          - "Proposta apresentada e aprovada pelo cliente 121Labs antes de
            qualquer implementação"
      - id: F22
        nome: "Adição de buckets sub-100ms ao histograma do N8N"
        status: "not-started"
        escopo:
          - "Adicionar buckets de resolução fina ao
            n8n_workflow_execution_duration_seconds: 0.005, 0.01, 0.025, 0.05"
          - "Atualizar configuração do prom-client no prod-collector-api ou no
            container N8N via variável de ambiente ou plugin"
          - "Validar que os novos buckets aparecem no endpoint /metrics e são
            coletados pelo Prometheus e armazenados no VictoriaMetrics"
        criterio_aceite:
          - "p50 e p95 sub-100ms mensuráveis por workflow após a atualização"
          - "Histórico de latência real disponível no VictoriaMetrics para
            comparação antes × depois de cada ação de tunning (F17, F18, F20)"
      - id: F23
        nome: "Correção do monitoramento de memória do servidor wf001"
        status: "not-started"
        escopo:
          - "Diagnosticar por que node_memory_* retorna vazio no scrape de wf001
            (label instance incorreto identificado no ANA-001)"
          - "Corrigir configuração de relabeling do scrape config Prometheus
            para o node_exporter de wf001"
          - "Validar que métricas de memória RAM e swap aparecem no
            VictoriaMetrics para instance=wf001"
        criterio_aceite:
          - "node_memory_MemAvailable_bytes{instance='wf001'} retorna valores
            válidos no Prometheus/VictoriaMetrics"
          - "Dashboard de memória de wf001 funcional — complementa dados de CPU
            já disponíveis (baseline ANA-001: 1–3% CPU em condição normal)"
      - id: F24
        nome: "Habilitação de métricas de concorrência do N8N"
        status: "not-started"
        escopo:
          - "Ativar e validar n8n_concurrency_* no endpoint /metrics do
