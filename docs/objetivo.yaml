        responsabilidades:
          - "Definir matriz de testes por risco e criticidade por feature"
          - "Executar validações funcionais e de observabilidade em wfdb01 antes
            de promover para wf001"
          - "Consolidar evidências métricas antes/depois para aprovação de cada
            ação de tunning"
        criterios_decisao:
          - "Sem regressões críticas em workflows prioritários"
          - "Desempenho e estabilidade dentro de limites aceitáveis"
      - role: databases_engineer
        skill_level: "expert"
        description: "Engenheiro de bancos de dados para validação funcional, tunning de
          bases de dados e querys, otimização de performance e integridade de
