---
# ansible/inventory/group_vars/wfdb01.yml
# Overrides para wfdb01 (N8N teste + observabilidade)

environment: wfdb01
vm_url: http://victoriametrics:8428 # VictoriaMetrics (rede Docker interna apenas)
n8n_metrics_url: https://testn8n.vya.digital # Endpoint métricas N8N (via Traefik)
n8n_services:
  # Nomes reais dos serviços em wfdb01
  - n8n_editor
  - n8n_worker
  - n8n_webhook
  - n8n_mcp

# --- F16 revisado: RabbitMQ Exporter ---
rabbitmq_compose_dir: /opt/docker_user/rabbitmq
rabbitmq_management_url: "http://rabbitmq:15672"
rabbitmq_exporter_user: "dialer"
# rabbitmq_exporter_password: definir via vault ou -e rabbitmq_exporter_password=SENHA
prometheus_config_file: /opt/docker_user/enterprise-observability/config/prometheus.yaml
prometheus_container_name: enterprise-prometheus
