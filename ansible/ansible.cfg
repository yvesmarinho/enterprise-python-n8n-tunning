[defaults]
# Caminho para roles do projeto (relativo a este arquivo)
roles_path = roles
inventory   = inventory/hosts.yml

# Host key checking desabilitado (VPS efêmeros com IPs fixos mas chaves variáveis)
host_key_checking = False

# Timeout de conexão SSH
timeout = 30

# Saída legível
stdout_callback = yaml

[privilege_escalation]
become        = false
become_method = sudo
become_user   = root
become_ask_pass = false

[ssh_connection]
# Pipelining evita temp file + sudo conflict no become_user com módulos que transferem arquivo
pipelining = True
ssh_args    = -C -o ControlMaster=auto -o ControlPersist=60s -i ~/.ssh/id_rsa
